[package]
name = "caesium-cli"
version = "2.8.5"
edition = "2021"
rust-version = "1.80"
description = "Extensive CLI, interactive TUI, and agent/MCP interface for Caesium Image Compressor"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lymphatus/caesium-image-compressor"

[[bin]]
name = "caesium-cli"
path = "src/main.rs"

[lib]
name = "caesium_cli"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
caesium = { package = "libcaesium", version = "=0.17.4" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
crossterm = "0.28"
dirs = "5.0"
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
img-parts = "0.3.3"
infer = "0.19.0"
kamadak-exif = "0.6"
ratatui = "0.29"
rayon = "1.10"
regex = "1.11"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
trash = "5.2"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
